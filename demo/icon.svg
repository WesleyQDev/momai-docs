<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="folioBack" x1="4" y1="4" x2="24" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <linearGradient id="folioFront" x1="6" y1="7" x2="24" y2="29" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="55%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="penNib" x1="16" y1="3" x2="29" y2="19" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="55%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
  </defs>

  <!-- Back angled studio card -->
  <rect x="4" y="5" width="17" height="22" rx="4" transform="rotate(-7 12.5 16)" fill="url(#folioBack)" opacity="0.5" />

  <!-- Front studio card -->
  <rect x="6" y="6" width="18" height="22" rx="4.2" fill="url(#folioFront)" />

  <!-- Clean white header bar inside card -->
  <rect x="9.5" y="10.5" width="7.5" height="2.4" rx="1.2" fill="#FFFFFF" />
  <rect x="9.5" y="15" width="11" height="2" rx="1" fill="#E0F2FE" />
  <rect x="9.5" y="18.8" width="8" height="2" rx="1" fill="#BAE6FD" />

  <!-- Bold Golden/Amber Pen Nib / Stylus diagonally overlapping -->
  <path
    d="M26.8 3.6C27.9 4.7 27.9 6.5 26.8 7.6L17.9 16.5L13.5 17.7L14.7 13.3L23.6 4.4C24.7 3.3 26.5 3.3 26.8 3.6Z"
    fill="url(#penNib)"
  />
  <!-- Pen highlight -->
  <path d="M24.2 5.2L16.3 13.1" stroke="#FEF9C3" stroke-width="1.1" stroke-linecap="round" />

  <!-- Crisp 4-point star spark -->
  <path
    d="M11 23.2L11.7 25L13.5 25.7L11.7 26.4L11 28.2L10.3 26.4L8.5 25.7L10.3 25L11 23.2Z"
    fill="#FDE047"
  />
</svg>
